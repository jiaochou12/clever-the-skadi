<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:" />
  <title>SkadiPet</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="stage"></div>

  <div id="bubble" class="hidden">
    <div id="chatlog"></div>
    <div id="inputrow">
      <input id="chatin" type="text" placeholder="想问点什么…（Enter 发送）" autocomplete="off" />
      <button id="send" title="发送">发送</button>
    </div>
  </div>

  <div id="ctxmenu" class="hidden">
    <div class="mi" data-act="settings">设置…</div>
    <div class="mi" data-act="quit">退出</div>
  </div>

  <script src="/static/bundle.js"></script>
</body>
</html>
